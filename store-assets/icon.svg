      <stop offset="0" stop-color="#A0648F"/>
      <stop offset="0.55" stop-color="#7B4B6E"/>
      <stop offset="1" stop-color="#46284B"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="url(#bg)"/>
  <circle cx="54" cy="54" r="34" fill="#FFFFFF" fill-opacity="0.08"/>
